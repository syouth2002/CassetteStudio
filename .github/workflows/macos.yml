name: macOS packages
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Optional successful run ID to reuse binaries for packaging-only changes'
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      SOURCE_RUN: ${{ inputs.source_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Toolchain and audio tools
        run: |
          if [ -z "$SOURCE_RUN" ]; then
            rustup update stable --no-self-update
            rustup default stable
          fi
          brew install ffmpeg
      - uses: actions/download-artifact@v4
        if: inputs.source_run != ''
        with:
          name: macos-${{ matrix.arch }}
          path: dist/prebuilt
          run-id: ${{ inputs.source_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and package
        run: |
          if [ -n "$SOURCE_RUN" ]; then
            export CASSETTE_PREBUILT_ARCHIVE="$PWD/dist/prebuilt/CassetteStudio-0.1.4-macOS-${{ matrix.arch }}.zip"
          fi
          sh scripts/package-public-macos.sh 0.1.4
      - name: Native app and audio smoke test
        run: python3 scripts/test-macos-package.py dist/releases/v0.1.4/macos-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/releases/v0.1.4/CassetteStudio-0.1.4-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
