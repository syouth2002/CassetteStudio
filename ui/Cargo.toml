[package]
name = "cassette-ui"
version = "0.2.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
ehttp = "0.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
epaint_default_fonts = "0.33.3"
svg2pdf = "0.13"
resvg = "0.45"
lopdf = { version = "0.38", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rodio = { version = "0.21.1", default-features = false, features = ["playback", "wav"] }
sys-locale = "0.3"
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Navigator", "Location", "HtmlCanvasElement", "HtmlAudioElement", "HtmlMediaElement", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "Element"] }
js-sys = "0.3"
