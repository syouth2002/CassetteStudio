<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cassette Studio</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f2f3f1}canvas{width:100%;height:100%;display:block}#loading{position:fixed;top:45%;left:10%;right:10%;text-align:center;font-family:sans-serif}</style></head>
<body><div id="loading">Cassette Studio — 起動中 / Loading…</div><canvas id="cassette-canvas"></canvas>
<script type="module">
const canvas=document.getElementById('cassette-canvas');
for(const type of ['mousedown','auxclick'])canvas.addEventListener(type,event=>{
 if(event.button!==1||!canvas.dataset.editorViewport)return;
 const [left,top,right,bottom,ppp]=canvas.dataset.editorViewport.split(',').map(Number),box=canvas.getBoundingClientRect();
 const x=(event.clientX-box.left)*canvas.width/box.width/ppp,y=(event.clientY-box.top)*canvas.height/box.height/ppp;
 if(x>=left&&x<=right&&y>=top&&y<=bottom)event.preventDefault();
});
import init from '/ui/cassette_ui.js';try{await init();document.getElementById('loading').remove();}catch(e){document.getElementById('loading').textContent='起動できませんでした / Startup failed: '+e;console.error(e);}</script></body></html>
